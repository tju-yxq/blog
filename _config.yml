# Hexo Configuration
title: "xdz' blog"
subtitle: 'AI Infra & Systems Notes'
description: 'LLM 推理基础设施、KV Cache 显存管理与系统实测记录'
keywords: 'AI Infra, LLM, vLLM, KV Cache, Hybrid Attention'
author: 小段子
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://tju-yxq.github.io/blog
root: /blog/
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - 'lectures/**'

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# ParticleX requires disabling Hexo built-in syntax highlighter
syntax_highlighter:

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ParticleX requires disabling yearly/monthly/daily archives
archive_generator:
  enabled: true
  per_page: 0
  yearly: false
  monthly: false
  daily: false

# Category & Tag
default_category: AI Infra
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Theme
theme: particlex
